<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Lärk</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#030303" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Lärk — edição web: assistente pessoal com memória, promessas, lembretes e voz, direto no navegador."
    />
    <meta name="application-name" content="Lärk" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lärk" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <style>
      /* Visual único (HUD escuro): fundo, cor e tipografia explícitos, acima de qualquer reset externo.
         A interface já trata as áreas seguras do aparelho (barra superior e abas), então :root não recebe
         padding extra — senão as faixas seguras seriam somadas duas vezes. */
      :root {
        color-scheme: dark;
        background: #030303;
        padding: 0;
      }
      html,
      body {
        margin: 0;
        background: #030303;
        color: #f4eeee;
      }
      body {
        font-family: 'Inter Variable', 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: 16px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 2rem; text-align: center">
        O Lärk precisa de JavaScript ativado para funcionar.
      </p>
    </noscript>
    <script type="module" src="/src/standalone/main.tsx"></script>
  </body>
</html>
